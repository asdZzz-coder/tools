# 推送 v* 標籤(例如 v1.2.0)時自動編譯,並把安裝檔發布到 GitHub Release。
#   git tag v1.2.0
#   git push origin v1.2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # ClickOnce 需要完整版 MSBuild,且 .NET 10 需要 Visual Studio 2026
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: microsoft/setup-msbuild@v2

      - name: 由標籤取得版本號
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v", "V")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "標籤需為 vX.Y.Z 格式,收到:${{ github.ref_name }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: ClickOnce 發布(單一執行檔,不含 .NET 執行環境)
        shell: pwsh
        run: |
          msbuild ZZZ\ZZZ.csproj -restore -t:Publish -p:PublishProfile=ClickOnceProfile `
            -p:Configuration=Release `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:ApplicationVersion=${{ steps.ver.outputs.version }}.0 `
            -nologo -v:m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包 ClickOnce 安裝檔
        shell: pwsh
        run: |
          $src = "ZZZ\bin\Release\net10.0-windows\win-x64\app.publish"
          $pkg = "dist\ClickOnce"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          # 不放 setup.exe:由 安裝.cmd 先複製到固定資料夾再安裝,避免 ClickOnce「已從其他位置安裝」的錯誤
          Copy-Item -LiteralPath "installer\安裝.cmd" $pkg
          Copy-Item "$src\Ledger.application" $pkg
          Copy-Item "$src\Application Files" $pkg -Recurse
          foreach ($i in "安裝.cmd", "Ledger.application", "Application Files") {
            if (-not (Test-Path -LiteralPath "$pkg\$i")) { throw "missing $i" }
          }
          Compress-Archive -Path "$pkg\*" -DestinationPath "dist\Ledger-ClickOnce-v${{ steps.ver.outputs.version }}.zip"

      - name: 免安裝版(單一執行檔,不含 .NET 執行環境)
        shell: pwsh
        run: |
          # 注意:要用 -p:SelfContained=false;.NET 10 CLI 的 --self-contained false 仍會包含執行環境
          dotnet publish ZZZ\ZZZ.csproj -c Release -r win-x64 -p:SelfContained=false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=${{ steps.ver.outputs.version }} -o dist\portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\portable\Ledger.exe dist\Ledger.exe

      - uses: softprops/action-gh-release@v2
        with:
          name: 簡易記帳 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## 下載
            - **Ledger-ClickOnce-v${{ steps.ver.outputs.version }}.zip**:解壓縮後執行 `安裝.cmd` 安裝(會建立開始選單與桌面捷徑)。
            - **Ledger.exe**:免安裝版,直接執行。

            兩種版本都需要 [.NET 10 桌面執行環境](https://dotnet.microsoft.com/download/dotnet/10.0)(未安裝時,開啟程式會提示下載)。
            記帳資料存放在 `%APPDATA%\Ledger`,更新或重新安裝都不會遺失。
          files: |
            dist/Ledger-ClickOnce-v${{ steps.ver.outputs.version }}.zip
            dist/Ledger.exe
